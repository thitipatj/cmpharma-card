<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMax slice">
  <!-- Faded Lanna scene behind the membership card: tree, khom lanterns, chedi, temple roof. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c27f"/><stop offset="1" stop-color="#c79a52"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b57a45"/><stop offset="1" stop-color="#8f5a32"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- tree canopy, top left -->
  <g fill="#8e9a7c" opacity=".32" filter="url(#soft)">
    <circle cx="20" cy="60" r="62"/><circle cx="85" cy="40" r="48"/><circle cx="130" cy="78" r="38"/>
    <circle cx="55" cy="125" r="50"/><circle cx="-10" cy="160" r="45"/><circle cx="110" cy="130" r="30"/>
  </g>
  <path d="M40 140 C46 200 38 260 30 330 L46 330 C52 262 60 205 58 140 Z" fill="#7d6a52" opacity=".22"/>

  <!-- khom lanterns, left -->
  <g opacity=".5">
    <g stroke="#9b7a4c" stroke-width="1"><line x1="44" y1="150" x2="44" y2="232"/><line x1="92" y1="170" x2="92" y2="300"/><line x1="22" y1="210" x2="22" y2="350"/></g>
    <g fill="#e3a14a">
      <path d="M44 232 c-16 6-16 44 0 50 c16-6 16-44 0-50z"/>
      <path d="M92 300 c-14 5-14 38 0 43 c14-5 14-38 0-43z"/>
      <path d="M22 350 c-13 5-13 34 0 39 c13-5 13-34 0-39z"/>
    </g>
    <g fill="#c4612f">
      <rect x="36" y="228" width="16" height="5" rx="1"/><rect x="36" y="281" width="16" height="5" rx="1"/>
      <rect x="85" y="296" width="14" height="5" rx="1"/><rect x="85" y="342" width="14" height="5" rx="1"/>
      <rect x="16" y="346" width="12" height="5" rx="1"/><rect x="16" y="388" width="12" height="5" rx="1"/>
    </g>
    <g stroke="#c4612f" stroke-width="1.4"><line x1="44" y1="286" x2="44" y2="306"/><line x1="92" y1="347" x2="92" y2="364"/><line x1="22" y1="393" x2="22" y2="408"/></g>
  </g>

  <!-- chedi, right -->
  <g fill="url(#gold)" opacity=".5">
    <path d="M318 40 L322 140 L314 140 Z"/>
    <rect x="309" y="140" width="18" height="10" rx="2"/>
    <rect x="304" y="150" width="28" height="9" rx="2"/>
    <rect x="300" y="159" width="36" height="8" rx="2"/>
    <path d="M296 167 C292 200 280 222 268 236 L368 236 C356 222 344 200 340 167 Z"/>
    <rect x="262" y="236" width="112" height="14" rx="2"/>
    <rect x="254" y="250" width="128" height="16" rx="2"/>
    <rect x="246" y="266" width="144" height="20" rx="2"/>
    <rect x="238" y="286" width="160" height="150"/>
  </g>
  <g stroke="#a97d3c" stroke-width="1" fill="none" opacity=".35">
    <line x1="246" y1="300" x2="398" y2="300"/><line x1="246" y1="330" x2="398" y2="330"/><line x1="246" y1="360" x2="398" y2="360"/>
    <path d="M300 395 v-30 a18 18 0 0 1 36 0 v30"/>
  </g>
  <!-- small chedi, far right -->
  <g fill="url(#gold)" opacity=".28">
    <path d="M236 150 L239 215 L233 215 Z"/>
    <path d="M226 215 C223 240 214 252 206 262 L266 262 C258 252 249 240 246 215 Z"/>
    <rect x="200" y="262" width="72" height="12" rx="2"/>
    <rect x="194" y="274" width="84" height="70"/>
  </g>

  <!-- temple (wihan) roof, bottom -->
  <g opacity=".42">
    <path d="M60 470 L180 400 L300 470 Z" fill="url(#roof)"/>
    <path d="M20 520 L180 430 L340 520 Z" fill="url(#roof)" opacity=".9"/>
    <path d="M-20 575 L180 470 L380 575 Z" fill="url(#roof)" opacity=".85"/>
    <g fill="none" stroke="#e2c27f" stroke-width="3" stroke-linecap="round">
      <path d="M60 470 L180 400 L300 470"/><path d="M20 520 L180 430 L340 520"/><path d="M-20 575 L180 470 L380 575"/>
    </g>
    <!-- chofa finials -->
    <g fill="none" stroke="#e2c27f" stroke-width="3" stroke-linecap="round">
      <path d="M180 400 c0-14 8-22 16-20"/><path d="M60 470 c-6-12-2-22 8-24"/><path d="M300 470 c6-12 2-22-8-24"/>
      <path d="M20 520 c-6-12-2-22 8-24"/><path d="M340 520 c6-12 2-22-8-24"/>
    </g>
    <rect x="30" y="575" width="300" height="70" fill="#d9c49e"/>
    <g fill="#b98f55"><rect x="60" y="585" width="10" height="60"/><rect x="120" y="585" width="10" height="60"/><rect x="230" y="585" width="10" height="60"/><rect x="290" y="585" width="10" height="60"/></g>
    <path d="M155 645 v-40 a25 25 0 0 1 50 0 v40 z" fill="#8f5a32"/>
  </g>
</svg>
